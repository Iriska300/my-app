apiVersion: v1
kind: Service
metadata:
  name: server-service
  labels:
    app: {{ .Release.Name }}-server
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
