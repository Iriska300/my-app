apiVersion: v1
kind: Service
metadata:
  name: client-service
  labels:
    app: {{ .Release.Name }}-client
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-client
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
